services:
  api:
    build:
      context: .
      dockerfile: server/backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - server/backend/.env
    environment:
      DATABASE_URL: sqlite:///var/linda.db
      PUBLIC_BASE_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:8000,http://localhost:5173
    volumes:
      - linda-data:/app/var

volumes:
  linda-data:
