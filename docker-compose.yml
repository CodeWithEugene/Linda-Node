services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./var:/app/var
  postgres:
    image: postgres:16-alpine
    profiles: [postgres]
    environment:
      POSTGRES_DB: linda
      POSTGRES_USER: linda
      POSTGRES_PASSWORD: linda
    ports:
      - "5432:5432"
