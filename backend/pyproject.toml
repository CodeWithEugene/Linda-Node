[project]
name = "linda-protocol-api"
version = "0.1.0"
description = "Linda Protocol activation-readiness API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "argon2-cffi>=23",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "lxml>=5",
  "pydantic-settings>=2.8",
  "PyJWT>=2.9",
  "PyYAML>=6.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "content*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
