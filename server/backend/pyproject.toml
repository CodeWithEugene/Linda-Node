[project]
name = "linda-protocol-api"
version = "0.1.0"
description = "Linda Protocol Person 2 workflow, exports, and partner API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "argon2-cffi>=23.1",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "lxml>=5.3",
  "weasyprint>=62",
  "psycopg[binary]>=3.2",
  "vercel>=0.7.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E701", "E702", "E731"]
