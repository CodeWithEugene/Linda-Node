policy:
  name: linda-demo-drought-policy
  authors: [Linda Protocol demo team]
  disclaimer: Team-authored demonstration policy. It is illustrative, not official ICPAC, NDMA, or government policy.
  hazard: drought
  ndma_phase_mapping:
    ready: Alert
    set: Alarm
    go: Emergency
  stages:
    ready: { indicator: spi3_chirps_forecast, condition: { probability_gte: 0.35, quantile: 0.33, min_lead_months: 2 } }
    set: { indicator: spi3_chirps_forecast, condition: { probability_gte: 0.50, quantile: 0.33, min_lead_months: 1 } }
    go: { indicator: spi3_chirps_forecast, condition: { probability_gte: 0.60, quantile: 0.20 } }
  gates:
    - { id: source_freshness, description: Grounding snapshot is within the seasonal cadence }
    - { id: schema_valid, description: All evidence snapshots pass their source schemas }
    - { id: lead_time, description: Eligible action lead times fit before onset }
  stop_trigger: { description: Revoke if the signal collapses, condition: { probability_lt: 0.30, on_indicator: spi3_chirps_forecast } }
  cost_loss:
    exposed_households: { source: manual, value: 12000, citation: Team estimate for demo; replace with WorldPop-derived figure }
    loss_per_household_usd: 180
    margin_usd: 5000
