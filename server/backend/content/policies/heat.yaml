policy:
  name: linda-heat-readiness-policy
  authors: [Linda Protocol team]
  disclaimer: >
    Team-authored readiness policy. Linda does not classify heat severity: the stage below is mapped
    from the severity level that ICPAC's own trigger rule assigns to a detected event. Costs and
    effectiveness values are illustrative and are not official ICPAC, NDMA, or government policy.
  hazard: heat
  # ICPAC publishes TMAX as a monitoring indicator only (supports_forecast: false), so heat readiness
  # is driven by detected trigger events rather than a seasonal probability.
  signal_basis: upstream_severity
  ndma_phase_mapping:
    ready: Alert
    set: Alarm
    go: Emergency
  stages:
    ready: { indicator: tmax_era5, condition: { upstream_severity_in: [low, minor, moderate] } }
    set: { indicator: tmax_era5, condition: { upstream_severity_in: [high, major] } }
    go: { indicator: tmax_era5, condition: { upstream_severity_in: [severe, extreme, critical] } }
  gates:
    - { id: source_freshness, description: Grounding snapshot is within the monitoring cadence }
    - { id: schema_valid, description: All evidence snapshots pass their source schemas }
    - { id: lead_time, description: Eligible action lead times fit the observed onset }
  stop_trigger:
    description: Revoke when the upstream trigger event is no longer active
    condition: { on_indicator: tmax_era5, resolved_upstream: true }
  cost_loss:
    exposed_households: { source: official_source, value: 8000, citation: ICPAC admin-1 exposure baseline for the affected unit }
    loss_per_household_usd: 90
    margin_usd: 3000
  source_freshness_max_days: 14
